<!doctype html>
<!--
  Source for public/og-image.png (1200×630), the link preview shown by
  WhatsApp, Discord, iMessage, Slack and X. Regenerate with:
    npx tsx scripts/seo/renderOgImage.ts
  Product name, the landing headline and one real feedback line only: no
  stats, no third-party branding. Key content stays in the middle ~1000px so
  square/cropped previews still read.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0A0B0D;
    color: #F4F2ED;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(55% 70% at 85% 35%, rgba(124, 58, 237, 0.42), transparent 70%),
      radial-gradient(40% 50% at 5% 0%, rgba(139, 92, 246, 0.16), transparent 70%);
  }
  .wrap { position: relative; height: 100%; padding: 64px 80px; display: flex; gap: 56px; align-items: center; }
  .left { flex: 1.15; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 44px; }
  .mark {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, #7C3AED, #6366F1);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 25px; color: #fff;
  }
  .name { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 28px; }
  h1 { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 58px; line-height: 1.08; letter-spacing: -0.01em; }
  h1 em { font-weight: 400; color: #A78BFA; }
  .sub { margin-top: 28px; font-size: 24px; color: #B9B6AE; }
  .card {
    flex: 0.85; background: #121317; border: 1px solid rgba(244, 242, 237, 0.12);
    border-radius: 28px; padding: 30px; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.7);
  }
  .label { font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .q { font-family: 'Libre Baskerville', serif; font-size: 21px; line-height: 1.35; margin: 10px 0 22px; }
  .row { border: 1px solid rgba(244, 242, 237, 0.12); border-radius: 18px; padding: 18px 20px; }
  .row + .row { margin-top: 14px; }
  .row p { font-size: 21px; margin-top: 6px; }
  .bad { background: rgba(248, 113, 113, 0.16); border-bottom: 3px solid #F87171; padding: 0 3px; border-radius: 4px; }
  .good { background: rgba(52, 211, 153, 0.16); border-bottom: 3px solid #34D399; padding: 0 3px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="left">
      <div class="brand"><div class="mark">F</div><div class="name">Français AI</div></div>
      <h1>Speak French out loud. <em>Know exactly what to fix.</em></h1>
      <p class="sub">IGCSE French speaking practice, with feedback on every answer.</p>
    </div>
    <div class="card">
      <div class="label" style="color:#83807A">Question</div>
      <div class="q">Qu’est-ce que tu as fait pendant les vacances&nbsp;?</div>
      <div class="row">
        <div class="label" style="color:#34D399">What you did well</div>
        <p>An opinion with a reason.</p>
      </div>
      <div class="row">
        <div class="label" style="color:#F87171">Fix this first</div>
        <p><span class="bad">j’ai allé</span> → <span class="good">je suis allé</span></p>
      </div>
    </div>
  </div>
</body>
</html>
