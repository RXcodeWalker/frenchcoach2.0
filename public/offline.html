<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#F6F5F1" />
  <title>You're offline — Français AI</title>
  <style>
    /* Self-contained: shown by sw.js when a page can't load, so no fonts, scripts or images from the network. */
    :root { --bg:#F6F5F1; --surface:#FFFFFF; --ink:#1C1914; --muted:#5E5850; --action:#7C3AED; --action-ink:#FFFFFF; --hairline:rgba(28,25,20,.09); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0B0B0E; --surface:#141418; --ink:#F2F1EE; --muted:#A6A29A; --hairline:rgba(255,255,255,.08); }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    main {
      width: 100%; max-width: 360px; text-align: center;
      background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px; padding: 32px 24px;
    }
    .mark {
      width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px; background: var(--action);
      color: var(--action-ink); font-weight: 800; font-size: 26px; line-height: 48px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 24px; }
    button {
      font: inherit; font-weight: 600; font-size: 15px; width: 100%; min-height: 48px;
      border: 0; border-radius: 8px; background: var(--action); color: var(--action-ink); cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--action); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">F</div>
    <h1>You're offline</h1>
    <p>Français AI needs the internet to listen to your answers and give feedback. Check your connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Come back by itself as soon as the connection does.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
