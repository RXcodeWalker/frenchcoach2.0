name: Feedback Email

# Emails each new in-app "Send feedback" message (public.user_feedback) to the
# owner — see scripts/scheduledJobs/sendFeedbackDigest.ts. Without RESEND_API_KEY
# and FEEDBACK_NOTIFY_EMAIL the job only warns: messages wait in the table and
# all go out once both secrets are set.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: feedback-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing repo secrets::Not set: ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions (see docs/systems/topology.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx scripts/scheduledJobs/sendFeedbackDigest.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FEEDBACK_NOTIFY_EMAIL: ${{ secrets.FEEDBACK_NOTIFY_EMAIL }}
          FEEDBACK_FROM: ${{ secrets.FEEDBACK_FROM }}
