name: Streak and Daily Goal Notifications

# Retention loop (docs/systems/retention-notifications.md). Hourly, because
# every learner is reached in their own timezone: daily_nudge sends at most one
# specific push per learner per local day (at their usual practice hour);
# weekly_report sends the Sunday-evening progress email (learner + optional
# parent copy). Departs from the scheduled-rpc.yml pattern because
# sendNotifications.ts makes external HTTP calls (Web Push, Resend) the
# database can't make itself — see its header for the claim-before-send design.
# Needs backend migration 20261104120000_retention_loop applied first.

on:
  schedule:
    # Off the hour: GitHub delays and drops :00 schedules most (observed ~8 h
    # between runs). The sender adapts to the real gap (notification_runs).
    - cron: '17 * * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        notif-type: [daily_nudge, weekly_report]
    steps:
      # Same fail-fast secret check as scheduled-rpc.yml. RESEND_API_KEY is
      # optional (without it the email fallback and weekly_report are skipped).
      # APP_URL (repo variable, optional) is the origin links point at.
      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing repo secrets::Not set: ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions (see docs/systems/topology.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx scripts/scheduledJobs/sendNotifications.ts ${{ matrix.notif-type }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          NOTIFY_FROM_EMAIL: ${{ vars.NOTIFY_FROM_EMAIL }}
