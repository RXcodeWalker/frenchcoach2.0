name: E2E (nightly)

# The full Playwright suite (npm run e2e:exam: whole exams, the scenario turn,
# exam pronunciation) — too slow for every push, so it runs once a night on
# main. Needs no secrets: speech, scoring and AI replies are all faked
# (playwright.config.ts). A failure shows as a red run in the Actions tab and
# GitHub emails the repo owner. "Run workflow" in the Actions tab runs it now.

on:
  schedule:
    - cron: '47 2 * * *' # 02:47 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full browser suite
        run: npm run e2e:exam
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-nightly-results
          path: test-results/
          retention-days: 14
