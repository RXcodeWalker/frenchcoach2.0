name: Teacher Monday Email

# The teacher dashboard's weekly digest (docs/systems/teacher-dashboard.md §6). Runs hourly;
# sendTeacherDigest.ts sends only when it is Monday 07:00–08:59 in each class's own time zone,
# and claims (class, week) in teacher_digest_log before sending, so no class gets two emails.
# Same outbound-HTTP pattern as notifications-streak-and-goal.yml (Resend).

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the emails instead of sending (and ignore the Monday window)'
        type: boolean
        default: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_SERVICE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing repo secrets::Not set: ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions (see docs/systems/topology.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Send
        run: npx tsx scripts/scheduledJobs/sendTeacherDigest.ts ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run --force' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          NOTIFY_FROM_EMAIL: ${{ vars.NOTIFY_FROM_EMAIL }}
